<!DOCTYPE html>
<!-- Logo do AgentYard, renderizado por scripts/make-logo.sh (Edge headless).
     Hash: a | b | c (variações do monograma Y); -light para fundo claro. ?s=tamanho em px. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}svg{display:block}</style></head>
<body>
<svg id="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2433"/><stop offset="1" stop-color="#0b0f15"/></linearGradient>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e8edf4"/></linearGradient>
  </defs>
  <g id="content"></g>
</svg>
<script>
  const star = (cx, cy, r) => `M${cx},${cy - r} Q${cx},${cy} ${cx + r},${cy} Q${cx},${cy} ${cx},${cy + r} Q${cx},${cy} ${cx - r},${cy} Q${cx},${cy} ${cx},${cy - r}Z`;
  const bgOf = dark => `<rect width="128" height="128" rx="28" fill="url(#${dark ? 'bg' : 'bgLight'})"/>`;
  const hole = dark => (dark ? '#141c28' : '#f2f5f9');
  const V = {
    // Y reto: dois ramos se juntam (merge) e seguem num tronco; o agente (✦) numa das pontas.
    a: dark => `${bgOf(dark)}
      <g fill="none" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
        <path d="M34 32 L64 68" stroke="#3aa8f0"/>
        <path d="M94 32 L64 68" stroke="#b56fc9"/>
        <path d="M64 68 V102" stroke="#4fbf7a"/>
      </g>
      <circle cx="34" cy="32" r="10" fill="#3aa8f0"/>
      <circle cx="64" cy="68" r="9.5" fill="${hole(dark)}" stroke="#e0a82e" stroke-width="6"/>
      <circle cx="64" cy="104" r="10" fill="#4fbf7a"/>
      <path d="${star(96, 28, 17)}" fill="#b56fc9"/>`,
    // Y curvo, como arestas de grafo de git; duas worktrees e o agente.
    b: dark => `${bgOf(dark)}
      <g fill="none" stroke-width="10" stroke-linecap="round">
        <path d="M36 28 C36 52 64 50 64 70" stroke="#3aa8f0"/>
        <path d="M92 28 C92 52 64 50 64 70" stroke="#b56fc9"/>
        <path d="M64 70 V104" stroke="#4fbf7a"/>
      </g>
      <circle cx="36" cy="28" r="9.5" fill="#3aa8f0"/>
      <circle cx="64" cy="70" r="9" fill="${hole(dark)}" stroke="#e0a82e" stroke-width="6"/>
      <circle cx="64" cy="104" r="9.5" fill="#4fbf7a"/>
      <path d="${star(92, 26, 16)}" fill="#b56fc9"/>`,
    // Pátio: três trilhos (agentes) convergindo num Y, o do meio com o ✦.
    c: dark => `${bgOf(dark)}
      <g fill="none" stroke-width="8" stroke-linecap="round">
        <path d="M28 30 C28 56 64 52 64 74" stroke="#3aa8f0"/>
        <path d="M64 30 V74" stroke="#e0a82e"/>
        <path d="M100 30 C100 56 64 52 64 74" stroke="#b56fc9"/>
        <path d="M64 74 V104" stroke="#4fbf7a" stroke-width="10"/>
      </g>
      <circle cx="28" cy="30" r="8" fill="#3aa8f0"/>
      <circle cx="100" cy="30" r="8" fill="#b56fc9"/>
      <path d="${star(64, 27, 15)}" fill="#e0a82e"/>
      <circle cx="64" cy="74" r="8.5" fill="${hole(dark)}" stroke="#e8edf4" stroke-width="5"/>
      <circle cx="64" cy="104" r="9.5" fill="#4fbf7a"/>`,
  };
  const [variant, theme] = (location.hash.slice(1) || 'a').split('-');
  document.getElementById('content').innerHTML = (V[variant] || V.a)(theme !== 'light');
  const s = Number(new URLSearchParams(location.search).get('s') || 128);
  const svg = document.getElementById('logo');
  svg.setAttribute('width', s);
  svg.setAttribute('height', s);
</script>
</body></html>
