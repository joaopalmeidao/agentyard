# Generated by the AgentYard extension.
#
# Whenever __BASE__ gets new commits, this workflow merges __BASE__ into every remote branch that
# matches BRANCH_PATTERNS, runs the check and pushes the result. A branch with a conflict or a failing
# check is left unchanged; the run summary ("Summary" tab) lists each one.
#
# Notes:
# - A push made with GITHUB_TOKEN does not trigger other workflows. If you want the branch's CI to run
#   after the sync, create a PAT with "contents: write", save it as the SYNC_TOKEN secret and
#   uncomment the "token:" line in the checkout of the "sync" job.
# - Protected branches must allow pushes from github-actions[bot] (or from the PAT owner).
# - If the extension's local sync is also on for the same branches, both may create different merges
#   of the same base. Prefer CI for shared branches and local sync for worktrees not yet published.
name: Sync __BASE__ into branches

on:
  push:
    branches: [__BASE__]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-__BASE__-into-branches
  cancel-in-progress: false

env:
  BASE_BRANCH: __BASE__
  # Space-separated patterns, bash "case" style: "*" matches anything, including "/".
  BRANCH_PATTERNS: "__PATTERNS__"
  EXCLUDE_PATTERNS: "__EXCLUDE__"

jobs:
  list:
    name: List branches behind __BASE__
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.list.outputs.branches }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        shell: bash
        run: |
          set -f
          selected=()
          for ref in $(git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/origin); do
            [ "$ref" = "HEAD" ] && continue
            [ "$ref" = "$BASE_BRANCH" ] && continue
            match=0
            for p in $BRANCH_PATTERNS; do case "$ref" in $p) match=1 ;; esac; done
            for p in $EXCLUDE_PATTERNS; do case "$ref" in $p) match=0 ;; esac; done
            [ "$match" = 1 ] || continue
            if git merge-base --is-ancestor "origin/$BASE_BRANCH" "origin/$ref"; then continue; fi
            selected+=("$ref")
          done
          json=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -cs 'map(select(length > 0))')
          echo "branches=$json" >> "$GITHUB_OUTPUT"
          echo "Branches to sync: $json"

  sync:
    name: Sync ${{ matrix.branch }}
    needs: list
    if: needs.list.outputs.branches != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        branch: ${{ fromJson(needs.list.outputs.branches) }}
    env:
      BRANCH: ${{ matrix.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          # token: ${{ secrets.SYNC_TOKEN }}

      - name: Merge __BASE__
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit -m "Merge $BASE_BRANCH into $BRANCH (auto sync)" "origin/$BASE_BRANCH"; then
            {
              echo "### ⚠️ \`$BRANCH\`: conflict merging \`$BASE_BRANCH\`"
              echo ""
              git diff --name-only --diff-filter=U | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            exit 1
          fi

__TEST_STEPS__

      - name: Push
        shell: bash
        run: |
          git push origin "HEAD:$BRANCH"
          echo "### ✅ \`$BRANCH\` updated with \`$BASE_BRANCH\`" >> "$GITHUB_STEP_SUMMARY"
